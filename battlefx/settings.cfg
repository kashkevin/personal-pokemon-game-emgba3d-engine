# Battle FX development settings (include/diorama/battle_fx.h); the environment
# variables PKMN_BATTLEFX, PKMN_BATTLEFX_LOG, PKMN_BATTLEFX_SYNC and
# PKMN_BATTLEFX_DRAW_BUDGET_MS override them.
# enabled=0 plays the original GBA animations. A line sync=1 makes the game wait for
# the animation core every frame (the test builds' default).
# drawBudgetMs=N: when this PC takes longer than N ms a picture to draw the HD effects
# - the 3D battle would slow the game - the animation goes on as on the GBA (logged),
# and after two such the HD effects are off until the battle ends. The player builds'
# default is 8, the test builds' 0 (no budget: the benchmark measures the full cost).
enabled=1
log=0
